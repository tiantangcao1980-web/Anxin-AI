<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- ===== [S-12] 安全头 ===== -->
    <!-- X-Frame-Options: 防止页面被嵌入 iframe（点击劫持防护） -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Referrer-Policy: 控制 HTTP Referrer 头，防止敏感 URL 泄露到第三方 -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- X-Content-Type-Options: 禁止浏览器 MIME 嗅探 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="theme-color" content="#ffffff" />
    <title>安心智能助手 · 企业级多 Persona AI 助手</title>

    <!-- ===== SEO 基础 ===== -->
    <meta name="description" content="安心智能助手覆盖法务 / 财税 / 合规 / 增长 / 出海全链路，10 个专业 Persona + 76 个 Skill，按权限装配，按风险隔离，按场景落地。" />
    <meta name="keywords" content="安心智能助手,Anxin AI,企业 AI 助手,法律 AI,合规 AI,智能合同,智能调查,Skill 沙箱,RBAC,飞书,钉钉" />
    <meta name="author" content="Anxin AI" />
    <link rel="canonical" href="https://anxin.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="安心智能助手" />
    <meta property="og:title" content="安心智能助手 · 把 AI 装进业务" />
    <meta property="og:description" content="10 Persona + 76 Skill + 六层权限闸门 + 五分层沙箱，企业级可落地的 AI 助手平台。" />
    <meta property="og:url" content="https://anxin.ai/" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="安心智能助手 · 企业级多 Persona AI 助手" />
    <meta name="twitter:description" content="覆盖法务 / 财税 / 合规 / 增长 / 出海全链路。" />
    <!-- 防闪烁：在 React 加载前立即应用主题 -->
    <script>
      ;(function() {
        try {
          var stored = JSON.parse(localStorage.getItem('ui-storage') || '{}')
          var theme = (stored.state && stored.state.theme) || 'system'
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0a0f1e')
          }
        } catch(e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
