# =====================================================================
# 安心智能助手 · NAS / 家用服务器 Lite Profile
#
# 适用场景：
#   - Synology / QNAP 等家用 NAS（2–4 GB RAM 常见）
#   - 单机 Docker Desktop 体验版
#   - 存算一体硬件出厂预装
#
# 相对生产版 (docker-compose.yml) 的裁剪：
#   - 用 Postgres 替代（仍需要关系型，性能够用且镜像小）
#   - 向量数据库改用 Chroma（嵌入式 SQLite + 索引，内存占用 ≈ 1/3）
#   - 知识图谱 Neo4j 降级为可选（默认不启动；混合/云端模式再开）
#   - MinIO 降级为本地文件卷（更省资源，~/anxin/storage）
#   - Prometheus / Grafana / SearXNG / LiveKit 默认不启动
#
# 启动：
#   cp .env.nas.example .env
#   docker compose -f docker-compose.nas.yml up -d
#
# 资源占用参考：backend(400MB) + postgres(150MB) + redis(30MB) + chroma(150MB)
# ≈ 总 RAM 800 MB，硬盘 1–2 GB。
# =====================================================================

services:
  # ---------- 后端 ----------
  backend:
    image: ghcr.io/anxin/legal-backend:${BACKEND_TAG:-latest}
    # Lite profile 下 NAS 用户可能想直连宿主机，暴露 8001 但仅绑定 127.0.0.1
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - RUNTIME_MODE=nas-lite
      # 数据库：SQLite 文件，挂载卷持久化
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-anxin_nas}@postgres:5432/legal_agent_db
      - REDIS_URL=redis://redis:6379/0
      # 向量库：使用 Chroma
      - VECTOR_BACKEND=chroma
      - CHROMA_URL=http://chroma:8000
      # 图数据库：Lite profile 默认关闭，模式切换时再启
      - NEO4J_ENABLED=false
      # 对象存储：本地文件系统（MinIO 关闭）
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/data/storage
      # CAPTCHA 在 NAS 自托管场景通常关闭
      - CAPTCHA_ENABLED=${CAPTCHA_ENABLED:-false}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - legal-nas
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M

  # ---------- 前端 ----------
  frontend:
    image: ghcr.io/anxin/legal-frontend:${FRONTEND_TAG:-latest}
    ports:
      - "3001:80"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_API_TARGET_URL=http://backend:8001
    depends_on:
      - backend
    networks:
      - legal-nas
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------- 关系型数据库 ----------
  # NAS 场景 PostgreSQL 太重可改 sqlite；但为保持 schema 兼容性仍推荐 pg。
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: legal_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anxin_nas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - legal-nas
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M

  # ---------- Redis（轻量缓存） ----------
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - legal-nas
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  # ---------- 向量数据库：Chroma（替代 Qdrant） ----------
  chroma:
    image: chromadb/chroma:0.4.24
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_HOST=0.0.0.0
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - legal-nas
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  # ---------- Neo4j（可选，仅 profile=graph 时启动） ----------
  neo4j:
    profiles: ["graph"]
    image: neo4j:5.16-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-anxin_nas_graph}
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
    networks:
      - legal-nas
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  legal-nas:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  neo4j_data:
