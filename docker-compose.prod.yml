# =====================================================================
# 安心智能助手 V3 · 生产环境 Docker Compose
#
# 适用场景：阿里云 ECS / 腾讯云 CVM 等公有云服务器
# 域名：anxinai.com（需提前配置 DNS A 记录指向服务器 IP）
#
# 启动前准备：
#   1. 复制环境变量模板：cp .env.prod.example .env
#   2. 填写必需配置：OPENAI_API_KEY, JWT_SECRET, POSTGRES_PASSWORD 等
#   3. 确保域名已指向服务器 IP（Let's Encrypt 需要验证域名）
#
# 启动：
#   bash scripts/deploy-prod.sh
#
# 或手动：
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec backend alembic upgrade head
#
# 资源占用参考：
#   backend(800MB) + postgres(300MB) + redis(50MB) + nginx(20MB)
#   ≈ 总 RAM 1.2 GB，硬盘 3–5 GB
# =====================================================================

services:
  # ---------- Nginx 反向代理 + HTTPS ----------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - legal-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------- Certbot (HTTPS 证书自动续期) ----------
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - legal-prod

  # ---------- 后端 API ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - RUNTIME_MODE=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/legal_agent_db
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_BACKEND=chroma
      - CHROMA_URL=http://chroma:8000
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/data/storage
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - CAPTCHA_ENABLED=${CAPTCHA_ENABLED:-false}
      - CORS_ORIGINS=https://anxinai.com,https://www.anxinai.com
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=legal_agent_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legal-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - legal-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Chroma 向量数据库 ----------
  chroma:
    image: chromadb/chroma:latest
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - legal-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  legal-prod:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
