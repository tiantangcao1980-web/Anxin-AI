<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>安心法务 GitNexus 图谱视图</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5edf7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 340px;
        z-index: 3;
        padding: 18px 22px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.68));
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      .meta {
        margin-top: 6px;
        color: #a9b8cc;
        font-size: 13px;
      }
      #graph {
        width: 100%;
        height: 100vh;
        display: block;
        background:
          linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          #0f172a;
        background-size: 28px 28px;
      }
      aside {
        height: 100vh;
        padding: 22px;
        overflow: auto;
        background: #111827;
        border-left: 1px solid rgba(148, 163, 184, 0.18);
      }
      aside h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      aside p {
        color: #b6c2d2;
        line-height: 1.6;
        font-size: 14px;
      }
      .pill {
        display: inline-flex;
        margin: 0 6px 8px 0;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(212, 165, 116, 0.16);
        color: #ffd6a5;
        font-size: 12px;
      }
      .legend {
        margin-top: 18px;
        display: grid;
        gap: 8px;
      }
      .legend div {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #c8d3e1;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .note {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid rgba(212, 165, 116, 0.28);
        border-radius: 8px;
        background: rgba(212, 165, 116, 0.08);
      }
      a {
        color: #93c5fd;
      }
      .link {
        stroke: rgba(148, 163, 184, 0.52);
        stroke-width: 1.5;
      }
      .node circle {
        stroke: rgba(255, 255, 255, 0.72);
        stroke-width: 1.5;
        cursor: grab;
      }
      .node text {
        fill: #e5edf7;
        font-size: 12px;
        paint-order: stroke;
        stroke: rgba(15, 23, 42, 0.88);
        stroke-width: 4px;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .edge-label {
        fill: #9fb0c5;
        font-size: 11px;
        paint-order: stroke;
        stroke: rgba(15, 23, 42, 0.9);
        stroke-width: 3px;
      }
      @media (max-width: 900px) {
        body {
          grid-template-columns: 1fr;
        }
        header {
          right: 0;
        }
        aside {
          height: auto;
          border-left: 0;
          border-top: 1px solid rgba(148, 163, 184, 0.18);
        }
        #graph {
          height: 72vh;
        }
      }
    </style>
  </head>
  <body>
    <section>
      <header>
        <h1>GitNexus 模块级图谱</h1>
        <div class="meta">基于 GitNexus 索引与本地源码体检整理：1181 文件 · 30003 节点 · 54587 关系 · 300 流程 · embeddings 28219</div>
      </header>
      <svg id="graph" role="img" aria-label="Anxin Smart Legal Services knowledge graph"></svg>
    </section>
    <aside>
      <h2 id="panel-title">项目知识图谱</h2>
      <p id="panel-desc">点击节点查看说明。拖动节点可以整理视图。</p>
      <div id="panel-tags"></div>
      <div class="legend">
        <div><span class="dot" style="background:#60a5fa"></span>客户端</div>
        <div><span class="dot" style="background:#34d399"></span>后端服务</div>
        <div><span class="dot" style="background:#fbbf24"></span>基础设施</div>
        <div><span class="dot" style="background:#f87171"></span>高风险/待收口</div>
        <div><span class="dot" style="background:#c084fc"></span>验证与知识库</div>
      </div>
      <div class="note">
        说明：这不是 GitNexus 原始全量图。当前 `gitnexus serve` 只提供 API/MCP 连接，根路径返回 404。
        此页是从 GitNexus 索引统计、历史 context 结果和源码验证整理出的可读模块图。
      </div>
      <p><a href="./index.html">返回 Wiki 首页</a></p>
    </aside>
    <script>
      const nodes = [
        { id: "web", label: "Web 主产品", group: "client", r: 26, desc: "React/Vite 主界面，覆盖用户端、Pro 端和后台管理。当前完成度最高。", tags: ["frontend", "routes", "beta"] },
        { id: "desktop", label: "Tauri 桌面端", group: "client", r: 21, desc: "复用 Web 前端，提供托盘、快捷键、Store、SQLite、通知等原生能力。同步仍需收口。", tags: ["tauri", "sqlite", "sync-risk"] },
        { id: "mobile", label: "Expo 移动端", group: "client", r: 20, desc: "独立移动 App MVP，覆盖登录、收件箱、聊天、任务、审批等。调查和智库搜索仍断点。", tags: ["expo", "mvp", "tsc-failing"] },
        { id: "mini", label: "Taro 小程序", group: "client", r: 17, desc: "轻量入口版，首页、聊天、个人中心可构建，多个快捷入口仍开发中。", tags: ["taro", "early"] },
        { id: "api", label: "FastAPI 后端", group: "backend", r: 28, desc: "后端主干，包含约 58 个 route 文件和大量服务层。", tags: ["fastapi", "sqlalchemy"] },
        { id: "auth", label: "认证/权限", group: "backend", r: 20, desc: "注册、登录、刷新 token、OAuth、路由守卫、feature 和模式门控。", tags: ["ProtectedRoute", "ModeGate"] },
        { id: "contract", label: "合同审查", group: "backend", r: 23, desc: "GitNexus 可识别上传审查、服务审查、风险评分、结果归一化、风险保存流程。", tags: ["real-flow", "tested"] },
        { id: "docs", label: "文档工作台", group: "backend", r: 21, desc: "文档上传、对象存储、版本、适配器与协作工作台。", tags: ["object-storage", "workbench"] },
        { id: "knowledge", label: "知识库/RAG", group: "backend", r: 21, desc: "KnowledgeService._check_kb_access 被上传、搜索、RAG 查询等流程复用。", tags: ["rag", "access-check"] },
        { id: "billing", label: "订阅/支付", group: "risk", r: 20, desc: "微信/支付宝 provider 有真实实现痕迹，但默认 mock 和未知渠道回退是生产风险。", tags: ["payment", "mock-default", "P0"] },
        { id: "esign", label: "电子签", group: "risk", r: 20, desc: "旧索引中 e签宝/法大大仍为占位；当前状态必须用源码和测试复核。", tags: ["esign", "provider-risk", "P0"] },
        { id: "im", label: "IM/通知", group: "backend", r: 19, desc: "WebSocket、离线消息和通知链路已有测试，但还需长连和多端验收。", tags: ["websocket", "notifications"] },
        { id: "sync", label: "同步引擎", group: "risk", r: 19, desc: "后端同步底座和桌面本地同步职责需要统一，避免假同步成功。", tags: ["desktop", "sync", "P0"] },
        { id: "db", label: "PostgreSQL", group: "infra", r: 18, desc: "核心业务数据与迁移。", tags: ["database"] },
        { id: "redis", label: "Redis", group: "infra", r: 16, desc: "缓存、限流、token 黑名单等。", tags: ["cache"] },
        { id: "vector", label: "Qdrant/Neo4j", group: "infra", r: 17, desc: "向量检索和知识图谱基础设施。", tags: ["rag", "graph"] },
        { id: "minio", label: "MinIO", group: "infra", r: 16, desc: "文档、合同附件和导出对象存储。", tags: ["object-storage"] },
        { id: "tests", label: "测试/质量", group: "knowledge", r: 20, desc: "后端 pytest、前端 Vitest/E2E、移动端 Vitest、桌面 cargo check、小程序构建。", tags: ["verification", "critical-diff"] },
        { id: "gitnexus", label: "GitNexus 索引", group: "knowledge", r: 18, desc: "当前索引：1181 文件、30003 节点、54587 关系、300 流程、28219 embeddings；direct rc CLI 的 context/query/cypher 已通过 smoke。", tags: ["index", "vector-ready"] }
      ];

      const links = [
        ["web", "api", "REST / WS"],
        ["desktop", "web", "复用前端"],
        ["desktop", "sync", "本地同步"],
        ["mobile", "api", "REST"],
        ["mini", "api", "REST"],
        ["api", "auth", "鉴权"],
        ["api", "contract", "合同"],
        ["api", "docs", "文档"],
        ["api", "knowledge", "RAG"],
        ["api", "billing", "订阅"],
        ["api", "esign", "签署"],
        ["api", "im", "消息"],
        ["api", "sync", "同步"],
        ["api", "db", "SQL"],
        ["api", "redis", "缓存"],
        ["knowledge", "vector", "检索"],
        ["docs", "minio", "对象"],
        ["contract", "minio", "附件"],
        ["billing", "tests", "回归"],
        ["contract", "tests", "覆盖"],
        ["auth", "tests", "覆盖"],
        ["sync", "tests", "待加强"],
        ["gitnexus", "tests", "影响面"],
        ["gitnexus", "contract", "流程"],
        ["gitnexus", "knowledge", "权限流"]
      ].map(([source, target, label]) => ({ source, target, label }));

      const colors = {
        client: "#60a5fa",
        backend: "#34d399",
        infra: "#fbbf24",
        risk: "#f87171",
        knowledge: "#c084fc"
      };

      const svg = document.getElementById("graph");
      const panelTitle = document.getElementById("panel-title");
      const panelDesc = document.getElementById("panel-desc");
      const panelTags = document.getElementById("panel-tags");
      let width = 0;
      let height = 0;
      let selected = null;

      const state = {
        nodes: nodes.map((node, i) => ({
          ...node,
          x: 220 + (i % 5) * 150,
          y: 150 + Math.floor(i / 5) * 120,
          vx: 0,
          vy: 0
        })),
        links
      };

      function resize() {
        width = svg.clientWidth;
        height = svg.clientHeight;
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      }

      function updatePanel(node) {
        selected = node;
        panelTitle.textContent = node.label;
        panelDesc.textContent = node.desc;
        panelTags.innerHTML = node.tags.map((tag) => `<span class="pill">${tag}</span>`).join("");
      }

      function tick() {
        const centerX = width * 0.45;
        const centerY = height * 0.52;
        for (const node of state.nodes) {
          node.vx += (centerX - node.x) * 0.0009;
          node.vy += (centerY - node.y) * 0.0009;
        }
        for (const link of state.links) {
          const a = getNode(link.source);
          const b = getNode(link.target);
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.max(1, Math.hypot(dx, dy));
          const target = 160;
          const force = (dist - target) * 0.0008;
          const fx = dx * force;
          const fy = dy * force;
          a.vx += fx;
          a.vy += fy;
          b.vx -= fx;
          b.vy -= fy;
        }
        for (let i = 0; i < state.nodes.length; i++) {
          for (let j = i + 1; j < state.nodes.length; j++) {
            const a = state.nodes[i];
            const b = state.nodes[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.max(1, Math.hypot(dx, dy));
            const min = a.r + b.r + 34;
            if (dist < min) {
              const push = (min - dist) * 0.012;
              const fx = (dx / dist) * push;
              const fy = (dy / dist) * push;
              a.vx -= fx;
              a.vy -= fy;
              b.vx += fx;
              b.vy += fy;
            }
          }
        }
        for (const node of state.nodes) {
          if (!node.dragging) {
            node.x += node.vx;
            node.y += node.vy;
          }
          node.vx *= 0.86;
          node.vy *= 0.86;
          node.x = Math.max(50, Math.min(width - 50, node.x));
          node.y = Math.max(90, Math.min(height - 50, node.y));
        }
        draw();
        requestAnimationFrame(tick);
      }

      function getNode(idOrNode) {
        if (typeof idOrNode === "object") return idOrNode;
        return state.nodes.find((node) => node.id === idOrNode);
      }

      function draw() {
        const linkMarkup = state.links.map((link) => {
          const a = getNode(link.source);
          const b = getNode(link.target);
          const mx = (a.x + b.x) / 2;
          const my = (a.y + b.y) / 2;
          return `
            <line class="link" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>
            <text class="edge-label" x="${mx}" y="${my}">${link.label}</text>
          `;
        }).join("");

        const nodeMarkup = state.nodes.map((node) => `
          <g class="node" data-id="${node.id}" transform="translate(${node.x},${node.y})">
            <circle r="${node.r}" fill="${colors[node.group]}"></circle>
            <text text-anchor="middle" y="${node.r + 17}">${node.label}</text>
          </g>
        `).join("");

        svg.innerHTML = `<g>${linkMarkup}</g><g>${nodeMarkup}</g>`;
        svg.querySelectorAll(".node").forEach((el) => {
          el.addEventListener("pointerdown", onPointerDown);
          el.addEventListener("click", () => updatePanel(getNode(el.dataset.id)));
        });
      }

      let dragNode = null;
      function onPointerDown(event) {
        dragNode = getNode(event.currentTarget.dataset.id);
        dragNode.dragging = true;
        event.currentTarget.setPointerCapture(event.pointerId);
        svg.addEventListener("pointermove", onPointerMove);
        svg.addEventListener("pointerup", onPointerUp, { once: true });
      }

      function onPointerMove(event) {
        if (!dragNode) return;
        const rect = svg.getBoundingClientRect();
        dragNode.x = event.clientX - rect.left;
        dragNode.y = event.clientY - rect.top;
        dragNode.vx = 0;
        dragNode.vy = 0;
        draw();
      }

      function onPointerUp() {
        if (dragNode) dragNode.dragging = false;
        dragNode = null;
        svg.removeEventListener("pointermove", onPointerMove);
      }

      window.addEventListener("resize", resize);
      resize();
      updatePanel(nodes[0]);
      tick();
    </script>
  </body>
</html>
