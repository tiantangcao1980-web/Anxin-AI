services:
  # ==================== 前端服务 (仅全量Docker部署时启用) ====================
  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_API_TARGET_URL=http://backend:8001
    depends_on:
      - backend
    networks:
      - legal-network

  # ==================== 后端服务 (仅全量Docker部署时启用) ====================
  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/legal_agent_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - MINIO_ENDPOINT=minio:9000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - legal-network

  # ==================== PostgreSQL数据库 ====================
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    environment:
      POSTGRES_DB: legal_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis缓存 ====================
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Qdrant向量数据库 ====================
  # ===== [Phase 6] 锁定版本 + 添加健康检查 =====
  # 原因：:latest 标签在不同时间拉取的镜像版本不同，导致环境不可复现
  qdrant:
    image: qdrant/qdrant:v1.12.1
    hostname: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || grep -q ':18BD' /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== Neo4j图数据库 ====================
  neo4j:
    image: neo4j:5-community
    hostname: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal-network
    restart: unless-stopped
    # ===== [Phase 6] 添加健康检查 =====
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==================== MinIO对象存储 ====================
  # ===== [Phase 6] 锁定版本 + 添加健康检查 =====
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

# ==================== 网络配置 ====================
networks:
  legal-network:
    driver: bridge

# ==================== 数据卷配置 ====================
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
