services:
  # ==================== 前端服务 (仅全量Docker部署时启用) ====================
  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:80"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_API_TARGET_URL=http://backend:8001
    depends_on:
      - backend
    networks:
      - legal-network

  # ==================== 后端服务 (仅全量Docker部署时启用) ====================
  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 后端仅绑定宿主机回环地址，供宿主机 Nginx 反代访问
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/legal_agent_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis_2026}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - MINIO_ENDPOINT=minio:9000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - legal-network

  # ==================== PostgreSQL数据库 ====================
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    environment:
      POSTGRES_DB: legal_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    # 安全：不暴露端口到宿主机，仅内网通信
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis缓存 ====================
  redis:
    image: redis:7-alpine
    hostname: redis
    # 安全：不暴露端口到宿主机 + 设置密码
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_2026} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Qdrant向量数据库 ====================
  # ===== [Phase 6] 锁定版本 + 添加健康检查 =====
  # 原因：:latest 标签在不同时间拉取的镜像版本不同，导致环境不可复现
  qdrant:
    image: qdrant/qdrant:v1.12.1
    hostname: qdrant
    # 安全：不暴露端口到宿主机
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || grep -q ':18BD' /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== Neo4j图数据库 ====================
  neo4j:
    image: neo4j:5-community
    hostname: neo4j
    # 安全：不暴露端口到宿主机
    expose:
      - "7474"
      - "7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal-network
    restart: unless-stopped
    # ===== [Phase 6] 添加健康检查 =====
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==================== MinIO对象存储 ====================
  # ===== [Phase 6] 锁定版本 + 添加健康检查 =====
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    hostname: minio
    command: server /data --console-address ":9001"
    # 安全：不暴露端口到宿主机
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - minio_data:/data
    networks:
      - legal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== LiveKit 音视频服务 ====================
  livekit-server:
    image: livekit/livekit-server:v1.8
    command: --config /livekit.yaml
    ports:
      - "7880:7880"       # 信令 WebSocket + API
      - "7881:7881"       # WebRTC over TCP
      - "50000-60000:50000-60000/udp"  # WebRTC 媒体 UDP
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - legal-network
    restart: unless-stopped

  # ==================== 监控（Sprint 6.1）====================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: anxin-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 安全：不暴露端口到宿主机，通过 Grafana 查看
    expose:
      - "9090"
    networks:
      - legal-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: anxin-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-anxin2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    # 安全：Grafana 仅绑定本机，通过 Nginx 反代访问
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - legal-network
    restart: unless-stopped
    depends_on:
      - prometheus

# ==================== 网络配置 ====================
networks:
  legal-network:
    driver: bridge

# ==================== 数据卷配置 ====================
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  prometheus_data:
  grafana_data:
