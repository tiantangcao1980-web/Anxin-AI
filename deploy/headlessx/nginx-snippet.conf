# HeadlessX 主 Nginx 反代片段 — 仅供内网调试 / 同机 backend 访问
#
# include /path/to/this/nginx-snippet.conf;
#
# 重要：HeadlessX 接受 x-api-key 鉴权，本身不应直接暴露公网。
# 推荐部署形态：
#   1. backend 与 headlessx 共一个 docker network → backend 直连 http://headlessx:3000，**无需 Nginx**
#   2. 跨主机部署 → 通过 VPN/内网，仍不公网暴露
#   3. 调试期需公网访问 → 配合 IP 白名单 + 强 API Key

# 调试期：内网 + IP 白名单
location /headlessx/ {
    # —— IP 白名单（必填）——
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    # —— 反代 ——
    proxy_pass http://headlessx:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # —— 渲染慢，timeout 调大 ——
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # —— 大响应（含截图 base64）——
    proxy_buffering off;
    client_max_body_size 32m;
}

# 健康检查可单独暴露给监控
location = /headlessx-health {
    proxy_pass http://headlessx:3000/health;
    proxy_set_header x-api-key "$http_x_api_key";
    access_log off;
}
