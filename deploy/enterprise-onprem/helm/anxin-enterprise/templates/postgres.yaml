{{- if .Values.postgres.inCluster.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "anxin.fullname" . }}-postgres-data
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.postgres.inCluster.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.inCluster.storage.size }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anxin.fullname" . }}-postgres
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "anxin.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "anxin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "anxin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.inCluster.image }}
          env:
            - name: POSTGRES_DB
              value: anxin_enterprise
            - name: POSTGRES_USER
              value: anxin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anxin.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "anxin"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "anxin.fullname" . }}-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anxin.fullname" . }}-postgres
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "anxin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
