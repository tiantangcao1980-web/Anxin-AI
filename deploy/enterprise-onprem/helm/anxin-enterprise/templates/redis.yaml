{{- if .Values.redis.inCluster.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "anxin.fullname" . }}-redis-data
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.redis.inCluster.storage.size }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anxin.fullname" . }}-redis
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "anxin.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "anxin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "anxin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.inCluster.image }}
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anxin.fullname" . }}-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "anxin.fullname" . }}-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anxin.fullname" . }}-redis
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    {{- include "anxin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
