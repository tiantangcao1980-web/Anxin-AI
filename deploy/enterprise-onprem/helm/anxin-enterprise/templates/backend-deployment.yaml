{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anxin.fullname" . }}-backend
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "anxin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "anxin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "anxin.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            - name: DEV_MODE
              value: "false"
            - name: AIRGAP
              value: {{ .Values.global.airgap | quote }}
            - name: AUTH_REDIS_FAIL_CLOSED
              value: {{ .Values.backend.authRedisFailClosed | quote }}
            - name: DATABASE_URL
              value: postgresql://anxin:$(POSTGRES_PASSWORD)@{{ include "anxin.fullname" . }}-postgres:5432/anxin_enterprise
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@{{ include "anxin.fullname" . }}-redis:6379/0
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anxin.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anxin.fullname" . }}-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "anxin.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "anxin.fullname" . }}-secrets
                  key: SECRET_KEY
            - name: SKILL_SANDBOX_PUBLISHER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "anxin.fullname" . }}-secrets
                  key: SKILL_SANDBOX_PUBLISHER_KEYS
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: skills
              mountPath: /app/skills
      volumes:
        - name: logs
          emptyDir: {}
        - name: skills
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anxin.fullname" . }}-backend
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "anxin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
