{{/*
共享 Secret —— 数据库密码 / Redis 密码 / JWT / Skill 公钥 / LDAP

部署前必须用 helm install --set 或 secretsManager 替换这里的占位值。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anxin.fullname" . }}-secrets
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | default "please-change-me" | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "please-change-me" | quote }}
  JWT_SECRET: {{ .Values.backend.jwtSecret | default "please-change-me-32-bytes-random" | quote }}
  SECRET_KEY: {{ .Values.backend.secretKey | default "please-change-me-32-bytes-random" | quote }}
  SKILL_SANDBOX_PUBLISHER_KEYS: {{ .Values.backend.skillSandboxPublisherKeys | quote }}
  {{- if .Values.ldapSync.enabled }}
  LDAP_BIND_PASSWORD: {{ .Values.ldapSync.config.bindPassword | default "" | quote }}
  {{- end }}
  {{- if .Values.imSync.enabled }}
  FEISHU_APP_SECRET: {{ .Values.imSync.feishu.appSecret | default "" | quote }}
  DINGTALK_APP_SECRET: {{ .Values.imSync.dingtalk.appSecret | default "" | quote }}
  WECOM_CONTACTS_SECRET: {{ .Values.imSync.wecom.contactsSecret | default "" | quote }}
  {{- end }}
