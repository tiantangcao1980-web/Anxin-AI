{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anxin.fullname" . }}-default-deny
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anxin.fullname" . }}-backend-allow
  labels:
    {{- include "anxin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "anxin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 接受 ingress controller 的请求
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Postgres / Redis（同 namespace 内）
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- range .Values.networkPolicy.egressAllowedCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
{{- end }}
