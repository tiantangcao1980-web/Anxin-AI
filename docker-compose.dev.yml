# ============================================================
# 安心智能助手系统 - 本地 Docker 开发环境
# ============================================================
# 用法:
#   启动全部:   docker compose -f docker-compose.dev.yml up -d
#   仅基础设施:  docker compose -f docker-compose.dev.yml up -d postgres redis
#   查看日志:   docker compose -f docker-compose.dev.yml logs -f backend
#   停止全部:   docker compose -f docker-compose.dev.yml down
#   清除数据:   docker compose -f docker-compose.dev.yml down -v
#
# 也可通过 Makefile 快捷使用:
#   make dev       — 启动全部服务
#   make dev-infra — 仅启动数据库等基础设施
#   make dev-logs  — 查看后端日志
#   make dev-down  — 停止全部
# ============================================================

services:
  # ==================== 前端 (Vite HMR 热更新) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/components.json:/app/components.json
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_API_TARGET_URL=http://backend:8001
    depends_on:
      - backend
    networks:
      - legal-dev-network
    restart: unless-stopped

  # ==================== 后端 (Uvicorn 热重载) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8005:8001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./data:/app/data
    environment:
      - DEBUG=true
      - DEV_MODE=true
      - ADMIN_INITIAL_PASSWORD=admin123
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/legal_agent_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password
      - JWT_SECRET_KEY=dev-secret-key-change-in-prod
      - BACKEND_PORT=8001
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    environment:
      POSTGRES_DB: legal_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - legal-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    networks:
      - legal-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Qdrant 向量数据库 (可选) ====================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    hostname: qdrant
    profiles: ["full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - dev_qdrant_data:/qdrant/storage
    networks:
      - legal-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || grep -q ':18BD' /proc/net/tcp6"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== Neo4j 图数据库 (可选) ====================
  neo4j:
    image: neo4j:5-community
    hostname: neo4j
    profiles: ["full"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - dev_neo4j_data:/data
    networks:
      - legal-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==================== MinIO 对象存储 (可选) ====================
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    hostname: minio
    profiles: ["full"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - dev_minio_data:/data
    networks:
      - legal-dev-network
    restart: unless-stopped

networks:
  legal-dev-network:
    driver: bridge

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_qdrant_data:
  dev_neo4j_data:
  dev_minio_data:
