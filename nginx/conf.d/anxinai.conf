# Anxin AI 安心智能助手 V3 - 生产环境 Nginx 配置
# 域名：anxinai.com
# HTTPS 证书：Let's Encrypt (自动续期)

# 限流配置 — DoS 防护
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name anxinai.com www.anxinai.com;

    # Let's Encrypt ACME 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name anxinai.com www.anxinai.com;

    # SSL 证书（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/anxinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anxinai.com/privkey.pem;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 10s;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(self)" always;
    # CSP：移除 'unsafe-eval'；img/connect 仅允许同源 + anxinai.com 子域
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.anxinai.com; font-src 'self' data:; connect-src 'self' https://*.anxinai.com wss://*.anxinai.com; frame-ancestors 'self';" always;

    # 请求体大小（合同/文档上传）
    client_max_body_size 50m;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # ===== 认证接口（更严格的限流） =====
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_conn conn 10;

        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== API 内嵌的 WebSocket 端点 =====
    location ~ ^/api/v1/[^/]+/ws(/|$) {
        limit_conn ws_conn 20;
        limit_req zone=ws burst=20 nodelay;

        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== API 反向代理 =====
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn 20;

        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;

        # 超时配置（AI 对话可能较长）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ===== WebSocket（IM / 实时协作 / LiveKit 信令） =====
    location /ws/ {
        limit_conn ws_conn 20;
        limit_req zone=ws burst=20 nodelay;

        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== API 文档：生产强制禁用 =====
    location = /docs {
        deny all;
        return 404;
    }
    location = /redoc {
        deny all;
        return 404;
    }
    location = /openapi.json {
        deny all;
        return 404;
    }

    # ===== 健康检查 =====
    location /health {
        proxy_pass http://backend:8001;
        access_log off;
    }

    # ===== 屏蔽敏感路径 =====
    location ~ /\. { deny all; }
    location ~ /(\.env|\.git|node_modules) { deny all; }

    # ===== 前端 SPA 路由（所有非 API 请求返回 index.html） =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
