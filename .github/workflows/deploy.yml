# ============================================================
# 安心智能助手系统 - 阿里云单服务器自动署部
# ============================================================
# 触发条件: 推送到 master / main / dev 分支
# 流程:
#   1. 检测变更范围 (前端 / 后端 / 都变了)
#   2. SSH 到阿里云服务器
#   3. git pull 拉取最新代码
#   4. docker compose build 重建变更的服务
#   5. docker compose up -d 重启变更的服务 (不影响数据库等基础设施)
#   6. 健康检查 + 清理旧镜像
# ============================================================
# 所需 GitHub Secrets (共 4-5 个，在 Settings > Secrets and variables > Actions 配置):
#
#   DEPLOY_HOST     阿里云服务器公网 IP (如 47.100.xx.xx)
#   DEPLOY_USER     SSH 用户名 (如 root)
#   DEPLOY_SSH_KEY  SSH 私钥 (完整内容，包含 BEGIN/END 行)
#   DEPLOY_PATH     服务器上项目目录 (如 /opt/AILegalAgent)
#   DEPLOY_PORT     SSH 端口，可选，默认 22
#
# ============================================================

name: 自动部署

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'skills/**'
      - '.gitignore'
      - 'LICENSE'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一分支的新推送会取消正在进行的旧部署，避免排队
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到阿里云
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # ========== 1. 检出代码 (用于变更检测) ==========
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 2  # 需要上一次提交来做 diff

      # ========== 2. 检测变更范围 ==========
      - name: 检测变更范围
        id: changes
        run: |
          # 对比当前提交和上一次提交，判断哪些目录有变化
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          echo "变更文件列表:"
          echo "$CHANGED_FILES"

          BACKEND_CHANGED="false"
          FRONTEND_CHANGED="false"

          if echo "$CHANGED_FILES" | grep -q "^backend/"; then
            BACKEND_CHANGED="true"
          fi

          if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
            FRONTEND_CHANGED="true"
          fi

          # docker-compose.yml 变了则两个都重建
          if echo "$CHANGED_FILES" | grep -q "^docker-compose.yml"; then
            BACKEND_CHANGED="true"
            FRONTEND_CHANGED="true"
          fi

          echo "backend_changed=$BACKEND_CHANGED" >> $GITHUB_OUTPUT
          echo "frontend_changed=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT
          echo ""
          echo "检测结果: backend=$BACKEND_CHANGED, frontend=$FRONTEND_CHANGED"

      - name: 部署前检查
        if: steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.frontend_changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend_changed }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend_changed }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "❌ 缺少 DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "❌ 缺少 DEPLOY_USER secret"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "❌ 缺少 DEPLOY_PATH secret"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "❌ 缺少 DEPLOY_SSH_KEY secret"; exit 1; }

          SSH_PORT="${DEPLOY_PORT:-22}"
          SERVICES=""
          if [ "$BACKEND_CHANGED" = "true" ]; then
            SERVICES="$SERVICES backend"
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            SERVICES="$SERVICES frontend"
          fi

          echo "================================================"
          echo "部署前检查通过"
          echo "  Host: $DEPLOY_HOST"
          echo "  User: $DEPLOY_USER"
          echo "  Port: $SSH_PORT"
          echo "  Path: $DEPLOY_PATH"
          echo "  Branch: $BRANCH"
          echo "  Commit: $COMMIT_SHA"
          echo "  Services:$SERVICES"
          echo "================================================"

      # ========== 3. 配置 SSH 连接 ==========
      - name: 配置 SSH 私钥
        if: steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.frontend_changed == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 使用 printf 写入密钥，避免 echo 解释转义字符
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 验证密钥格式（不泄露内容）
          echo "=== 密钥格式检查 ==="
          echo "文件大小: $(wc -c < ~/.ssh/deploy_key) 字节"
          echo "行数: $(wc -l < ~/.ssh/deploy_key)"
          echo "首行: $(head -1 ~/.ssh/deploy_key)"
          echo "末行: $(tail -1 ~/.ssh/deploy_key)"
          echo "权限: $(ls -la ~/.ssh/deploy_key)"

          # 用 ssh-keygen 验证密钥有效性
          if ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "✅ 密钥格式有效"
            echo "公钥指纹: $(ssh-keygen -lf ~/.ssh/deploy_key)"
          else
            echo "❌ 密钥格式无效！请检查 DEPLOY_SSH_KEY secret 的内容"
            echo "   确保包含完整的 BEGIN/END 行，且换行符正确"
            exit 1
          fi

      - name: 写入 known_hosts
        if: steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.frontend_changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          SSH_PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 验证 SSH 连通性
        if: steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.frontend_changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          SSH_PORT="${DEPLOY_PORT:-22}"
          echo "连接到 ${DEPLOY_USER}@${DEPLOY_HOST}:${SSH_PORT}"
          echo "本地公钥指纹: $(ssh-keygen -lf ~/.ssh/deploy_key 2>/dev/null || echo '无法读取')"
          # -v 参数显示详细认证过程，方便诊断失败原因
          ssh -v \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -p "$SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo 'SSH 连接成功'"

      # ========== 4. SSH 到服务器执行部署 ==========
      - name: SSH 部署
        if: steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.frontend_changed == 'true'
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend_changed }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend_changed }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          SSH_PORT="${DEPLOY_PORT:-22}"
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -p "$SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "BACKEND_CHANGED='${BACKEND_CHANGED}' FRONTEND_CHANGED='${FRONTEND_CHANGED}' BRANCH='${BRANCH}' COMMIT_SHA='${COMMIT_SHA}' DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE_SCRIPT'
          set -e

          echo "================================================"
          echo "  开始部署 - 分支: $BRANCH"
          echo "  提交: $COMMIT_SHA"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "================================================"

          cd "$DEPLOY_PATH"

          # ---------- 拉取最新代码 ----------
          echo ""
          echo "[1/5] 拉取最新代码..."

          # 备份本地 .env 文件（不通过 Git 管理）
          ENV_FILES=".env backend/.env backend/.env.local frontend/.env livekit.yaml"
          for f in $ENV_FILES; do
            if [ -f "$f" ]; then
              cp "$f" "${f}.deploy-backup" 2>/dev/null || true
            fi
          done

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          # 如果本地和远端分叉（如 force push 后），强制重置到远端
          if ! git merge-base --is-ancestor "origin/$BRANCH" HEAD 2>/dev/null && \
             ! git merge-base --is-ancestor HEAD "origin/$BRANCH" 2>/dev/null; then
            echo "  检测到历史分叉，执行 git reset --hard origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
          else
            git pull origin "$BRANCH"
          fi

          echo "当前版本: $(git log -1 --format='%h %s')"

          # 恢复 .env 备份
          for f in $ENV_FILES; do
            if [ -f "${f}.deploy-backup" ]; then
              mv "${f}.deploy-backup" "$f"
            fi
          done

          # 验证关键 .env 文件存在
          if [ ! -f ".env" ]; then
            echo "⚠️  警告: .env 文件不存在！请在服务器上手动创建"
            echo "   参考: cp .env.example .env && vim .env"
          fi

          # ---------- 确定要部署的服务 ----------
          SERVICES=""
          if [ "$BACKEND_CHANGED" = "true" ]; then
            SERVICES="$SERVICES backend"
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            SERVICES="$SERVICES frontend"
          fi
          echo ""
          echo "[2/6] 需要重建的服务: $SERVICES"

          # ---------- 构建镜像 ----------
          echo ""
          echo "[3/6] 构建 Docker 镜像..."
          # DOCKER_BUILDKIT=1 启用 BuildKit，支持 --mount=type=cache 缓存加速
          DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker compose build $SERVICES

          # ---------- 重启服务 (不影响数据库等基础设施) ----------
          echo ""
          echo "[4/6] 重启服务..."
          docker compose up -d --no-deps --force-recreate $SERVICES

          if [ "$BACKEND_CHANGED" = "true" ]; then
            echo ""
            echo "[5/6] 运行数据库迁移..."
            docker compose exec -T backend alembic upgrade head
          fi

          # ---------- 健康检查 ----------
          echo ""
          echo "[6/6] 健康检查..."
          sleep 8

          # 检查容器是否运行
          FAILED=""
          for svc in $SERVICES; do
            STATUS=$(docker compose ps $svc --format '{{.Status}}' 2>/dev/null || echo "unknown")
            if echo "$STATUS" | grep -qi "up"; then
              echo "  ✅ $svc - 运行中 ($STATUS)"
            else
              echo "  ❌ $svc - 异常 ($STATUS)"
              echo "  最后20行日志:"
              docker compose logs --tail=20 $svc
              FAILED="$FAILED $svc"
            fi
          done

          # 后端额外检查 /health 接口
          if [ "$BACKEND_CHANGED" = "true" ]; then
            echo ""
            echo "  检查后端 /health 接口..."
            for i in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
                echo "  ✅ 后端健康检查通过"
                break
              fi
              if [ $i -eq 6 ]; then
                echo "  ⚠️  后端健康检查超时 (可能仍在启动)"
              fi
              sleep 5
            done
          fi

          # ---------- 清理旧镜像 ----------
          echo ""
          echo "清理旧镜像..."
          docker image prune -f

          # ---------- 最终状态 ----------
          echo ""
          echo "================================================"
          if [ -z "$FAILED" ]; then
            echo "  ✅ 部署成功!"
          else
            echo "  ⚠️  部分服务异常: $FAILED"
            echo "  请手动检查: docker compose logs $FAILED"
          fi
          echo "  分支: $BRANCH"
          echo "  提交: $(git log -1 --format='%h %s')"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "================================================"

          # 如果有失败的服务，以非零退出码结束，让 GitHub Actions 标记为失败
          if [ -n "$FAILED" ]; then
            exit 1
          fi
          REMOTE_SCRIPT

      # ========== 5. 无变更时跳过 ==========
      - name: 无需部署
        if: steps.changes.outputs.backend_changed != 'true' && steps.changes.outputs.frontend_changed != 'true'
        run: echo "前端和后端代码无变更，跳过部署"
