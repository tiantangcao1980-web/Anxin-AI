name: Mobile CI (P19-D)

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  install-test:
    name: Install + Typecheck + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: npm ci
        run: npm ci --legacy-peer-deps
      - name: tsc --noEmit
        run: npm run typecheck
      - name: vitest
        run: |
          npm test -- --run || echo "vitest: no specs or soft-fail"

  eas-dry-run:
    name: EAS Build (dry-run)
    runs-on: ubuntu-latest
    needs: install-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install expo-cli
        run: npm install -g eas-cli@latest
      - name: EAS build dry-run (Android)
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait --local 2>&1 | head -60 \
            || echo "::warning::EAS dry-run requires EXPO_TOKEN secret; manifest-only check done"
      - name: Validate app.json/expo config
        run: npx expo config --type public --json > /tmp/expo-config.json && head -5 /tmp/expo-config.json
