name: Build Desktop & Mobile Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台 (all/desktop/android/ios)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - android
          - ios

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # ===== macOS 桌面端 =====
  build-macos:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'desktop' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      - name: 构建 macOS (Apple Silicon)
        working-directory: desktop
        run: cargo tauri build --target aarch64-apple-darwin

      - name: 构建 macOS (Intel)
        working-directory: desktop
        run: cargo tauri build --target x86_64-apple-darwin

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            desktop/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # ===== Windows 桌面端 =====
  build-windows:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'desktop' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      - name: 构建 Windows
        working-directory: desktop
        run: cargo tauri build

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe

  # ===== Android =====
  build-android:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'android' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 初始化 Android 项目
        working-directory: desktop
        run: cargo tauri android init

      - name: 构建 Android APK
        working-directory: desktop
        run: cargo tauri android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            desktop/gen/android/app/build/outputs/apk/**/*.apk

  # ===== iOS =====
  build-ios:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'ios' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 初始化 iOS 项目
        working-directory: desktop
        run: cargo tauri ios init

      - name: 构建 iOS (模拟器)
        working-directory: desktop
        run: cargo tauri ios build
        env:
          TAURI_APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            desktop/gen/apple/build/**/*.app

  # ===== 发布到 GitHub Releases =====
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
