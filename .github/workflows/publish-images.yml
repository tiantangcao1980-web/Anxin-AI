name: Publish Multi-Arch Images

# 构建并发布 multi-arch（amd64 + arm64）容器镜像到 GitHub Container Registry。
# 适用于 NAS（多为 ARM64）与云端服务器（多为 AMD64）一份镜像两端运行。
#
# 触发：
#   - 推送 v* tag 发布正式版
#   - 推送到 main 分支发布 latest dev 版
#   - 手动触发（workflow_dispatch）

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/legal-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/legal-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
          else
            TAG=latest
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ---------- Backend ----------
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ---------- Frontend ----------
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Summary
        run: |
          echo "✅ Published backend ${BACKEND_IMAGE}:${{ steps.meta.outputs.tag }} (amd64+arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Published frontend ${FRONTEND_IMAGE}:${{ steps.meta.outputs.tag }} (amd64+arm64)" >> "$GITHUB_STEP_SUMMARY"
