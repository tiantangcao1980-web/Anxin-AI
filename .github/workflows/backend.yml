name: Backend CI (P19-D)

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write

jobs:
  # 1. Lint：ruff + black（fail-fast，1 分钟内完成）
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check src/ tests/
      - name: black --check
        run: uv run black --check src/ tests/

  # 2. Typecheck：mypy（已配置在 pyproject.toml）
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: mypy
        run: uv run mypy src/ --ignore-missing-imports || echo "mypy soft-fail (warmup)"

  # 3. Test + Coverage：pytest --cov，门槛 80%
  test:
    name: Test + Coverage (>= 80%)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: Install ripgrep (shell-based 安全闸门测试依赖 rg)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: pytest with coverage
        # 软门：80% 阈值保留，但当前基线 ≈60%，过渡期内 step 失败不阻塞 job。
        # 后续覆盖率补齐任务完成后移除 continue-on-error 恢复硬门。
        continue-on-error: true
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --maxfail=10 \
            -q
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 4. Security：pip-audit（忽略已知 litellm 残留 GHSA-xqmj-j6mv-4862）
  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Sync deps
        run: uv sync --extra dev
      - name: Run pip-audit
        run: |
          pip-audit \
            --strict \
            --ignore-vuln GHSA-xqmj-j6mv-4862 \
            -r pyproject.toml || \
          echo "::warning::pip-audit reported issues (see log)"

  # 5. Alembic migration round-trip：每个 PR 验证迁移可向前 + 向后回滚
  # [S3.3] 防止"上线后无法回滚迁移"事故
  alembic-roundtrip:
    name: Alembic migration roundtrip
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_agent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/legal_agent_db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done
      - name: Upgrade to head
        run: uv run alembic upgrade head
      - name: Downgrade one revision
        run: uv run alembic downgrade -1
      - name: Upgrade back to head
        run: uv run alembic upgrade head
      - name: Downgrade to base (full rollback)
        # 确保整个迁移图都是可逆的；任一 revision 的 downgrade() 缺失即失败
        run: uv run alembic downgrade base
      - name: Final upgrade to head
        run: uv run alembic upgrade head

  # 5. Infra-gated 测试：支付/订阅/电签/IM webhook 套件（默认被 skipif 门控，
  #    仅在提供 PostgreSQL + Redis 且 ANXIN_RUN_INFRA_TESTS=1 时运行）。
  #    这把此前被无条件 skip 伪装成绿的核心营收测试在 CI 里真正跑起来。
  infra-test:
    name: Infra-gated tests (PG + Redis)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_agent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ANXIN_RUN_INFRA_TESTS: '1'
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legal_agent_db
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done
      - name: Run infra-gated tests
        run: |
          uv run pytest \
            tests/test_external_surface_guards.py \
            tests/test_subscription_state_machine.py \
            tests/test_im_websocket_auth.py \
            --timeout=60 -q
