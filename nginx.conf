# 安心AI法务 — Nginx 反向代理配置
# 用于生产环境部署

# 限流配置
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream frontend {
    server 127.0.0.1:3001;
}

upstream backend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name anxinfawu.com www.anxinfawu.com;

    # HTTP → HTTPS 重定向
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name anxinfawu.com www.anxinfawu.com;

    # SSL 证书（Let's Encrypt / 阿里云）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:;" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 请求体大小（合同文件上传）
    client_max_body_size 50m;

    # 前端静态资源
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA 路由回退
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # 静态资源缓存（Vite 构建产物带 hash）
    location /assets/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 路径下的 WebSocket 端点（chat/ws, collaboration/ws, im/ws 等）
    # regex location 优先于 prefix location，匹配 /api/v1/{module}/ws 及其子路径
    location ~ ^/api/v1/[^/]+/ws(/|$) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 接口
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn 20;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # 长连接（SSE 调查流）
    }

    # 认证接口（更严格的限流）
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket（IM、实时协作、LiveKit 信令）
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # 长连接
        proxy_send_timeout 3600s;
    }

    # API 文档（仅开发/内网环境）
    location /docs {
        # 生产环境建议关闭
        # deny all;
        proxy_pass http://backend;
    }

    location /redoc {
        proxy_pass http://backend;
    }

    # 健康检查（后端直接注册在根路径 /health）
    location /health {
        proxy_pass http://backend;
        access_log off;
    }

    # 屏蔽敏感路径
    location ~ /\. {
        deny all;
    }

    location ~ /(\.env|\.git|node_modules) {
        deny all;
    }
}
