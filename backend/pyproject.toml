[project]
name = "anxin-ai-backend"
version = "0.1.0"
description = "安心智能助手系统后端服务"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Anxin AI Team" }
]
keywords = ["ai", "legal", "finance", "tax", "compliance", "multi-agent", "smart-assistant", "fastapi"]

dependencies = [
    # Web框架
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # 缓存与任务队列
    "redis>=5.0.1",
    "celery>=5.3.6",
    # 多智能体框架（自有 Harness 层；CAMEL-AI 已于 2026-05 全量剥离）
    "mcp>=1.0.0",
    "jsonschema>=4.0.0",
    # 向量数据库
    # 服务端 docker 镜像固定在 qdrant/qdrant:v1.12.1，
    # 为避免 Major 版本差引发 check_compatibility 警告与 API 差异，
    # 客户端锁定在 1.12.x 兼容范围内；升级服务端前不要放开上限。
    "qdrant-client>=1.12.0,<1.13.0",
    # 知识图谱
    "neo4j>=5.15.0",
    # 文档处理
    # P16-D: pypdf 6.10.2 修复 12 个 CVE/GHSA（PDF 解析栈）
    "pypdf>=6.10.2",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.0",
    "reportlab>=4.0",
    "openpyxl>=3.1.2",
    "python-pptx>=1",
    "pdfplumber>=0.11",
    "pytesseract>=0.3",
    # AI/ML
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "tiktoken>=0.7.0",
    # litellm：CAMEL-AI 剥离后已无版本耦合约束，仅保留最低基线。
    # GHSA-xqmj-j6mv-4862 残留漏洞清单详见 docs/v3/P16_DEPENDENCY_UPGRADE.md。
    "litellm>=1.82.0",
    # 工具
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    # P16-D: cryptography 46.0.7 修复 CVE-2026-26007 / 34073 / 39892 三项高危
    "cryptography>=46.0.7",
    # P16-D: pyjwt 2.12.0 修复 CVE-2026-32597
    "pyjwt>=2.12.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    # 对象存储
    "minio>=7.2.3",
    # 数据处理
    "pandas>=2.1.4",
    "numpy>=1.26.3",
    "email-validator>=2.3.0",
    "playwright>=1.57.0",
    "beautifulsoup4>=4.14.3",
    # P6-A FetchService 静态解析（selectolax 比 BS4 快 5-10x；lxml 用于 XPath）
    "selectolax>=0.3",
    # P16-D: lxml 与 pillow 受 crawl4ai (>=0.4,<0.7 锁 lxml<6 / pillow<11) 上限制约，
    # 目前 5.x / 10.x 线无更高补丁版本，CVE-2026-41066（lxml）与 CVE-2026-25990/40192（pillow）
    # 暂列入残留漏洞清单，待 crawl4ai 上游放开后再升级。详见 docs/v3/P16_DEPENDENCY_UPGRADE.md。
    "lxml>=5.4",
    "pillow>=10.4",
    # LiveKit 音视频通话
    "livekit-api>=0.7.0",
    # Crawl4AI LLM 友好爬取
    "crawl4ai>=0.4.0",
    # P5 skill_registry / skill_executor
    "pyyaml>=6.0",
    "watchdog>=4.0",
    # P19-A 可观测层（Sentry + Prometheus）
    "sentry-sdk[fastapi]>=2.20.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
    "black>=23.12.1",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

local-ai = [
    "sentence-transformers>=2.3.1",
]

# P13-A 多模态文档解析（MinerU + 公章识别 + 表格 OCR）。
# 默认不安装；接入真 MinerU 时 ``pip install '.[multimodal-rag]'`` 拉起。
multimodal-rag = [
    "magic-pdf>=0.7.0",            # MinerU 主 SDK（含 OCR + layout 解析）
    "pdfplumber>=0.11.0",           # PDF 表格 fallback
    "opencv-python-headless>=4.9",  # 公章 / 红色 mask 检测
    "pillow>=10.0",                 # 图像预处理
]

# livekit 依赖已移至 requirements-livekit.txt
# 原因：livekit-agents 与 camel-ai 存在传递依赖冲突
# 安装方式：pip install -r requirements-livekit.txt

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
# FastAPI intentionally uses dependency/parameter helper calls such as
# Depends(), Query(), Body(), and require_permission() in route defaults.
# SQLAlchemy boolean column filters intentionally use == True/False semantics.
# Historical Chinese docstrings/templates contain whitespace-only blank lines;
# git diff --check remains the release hygiene gate for newly touched lines.
# UP042: existing `class Foo(str, Enum)` patterns intentionally preserved —
#   StrEnum 改造会改变 `str(Foo.X)` 输出，会破坏序列化兼容（后续单独迁移）。
# E402: pytest fixtures、sys.path 引导、`from __future__` 之后的条件导入
#   合法地出现在非 import 语句之后。
# N806: PascalCase 局部别名（FetchRequestCls 等）刻意保留以镜像上游命名。
# E741: 历史短变量名 `l`（line / list 迭代器）在上下文清晰处保留。
ignore = ["E501", "B008", "E712", "W293", "UP042", "E402", "N806", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Relying on Driver's destructor to close the session is deprecated:DeprecationWarning:neo4j\\._sync\\.driver",
]
