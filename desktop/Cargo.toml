[package]
name = "anxin-legal-desktop"
version = "1.0.0"
description = "安心法务桌面客户端"
authors = ["Anxin Legal Team"]
edition = "2021"

[lib]
name = "anxin_legal_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
